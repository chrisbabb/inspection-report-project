services:
  postgres:
    image: postgres:16
    container_name: him_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: him_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: him_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Admin console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: